<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurudu Experience ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}

body{
  min-height:100vh;
  background: radial-gradient(circle at top,#7a0000,#2c0000 60%,#000);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}

.bg{
  position:fixed;inset:0;
  background: radial-gradient(circle at 30% 30%,#ffb70333,#fb850033,#000);
  z-index:-2;
}

/* 🪔 oil lamp glow */
.lamp{
  position:fixed;
  bottom:20px;left:50%;
  transform:translateX(-50%);
  width:80px;height:80px;
  background:radial-gradient(circle,#ffd60a,#fb8500);
  border-radius:50%;
  filter:blur(25px);
  animation:flicker 1.5s infinite alternate;
}
@keyframes flicker{from{opacity:.7}to{opacity:1}}

/* 🥁 drum pulse */
.drum{
  position:fixed;
  top:20px;right:20px;
  width:20px;height:20px;
  border-radius:50%;
  background:#ffd60a;
  animation:beat 1s infinite;
}
@keyframes beat{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.5)}
}

.cursor-glow{
  position:fixed;
  width:300px;height:300px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,183,3,0.25),transparent 60%);
  pointer-events:none;
  transform:translate(-50%,-50%);
  z-index:-1;
}

.container{text-align:center;padding:30px;z-index:2}

h1{
  font-size:clamp(3rem,8vw,6rem);
  background:linear-gradient(90deg,#ffd60a,#ffb703,#fb8500);
  -webkit-background-clip:text;color:transparent;
}

p{margin-top:15px;font-size:clamp(1rem,3vw,1.3rem);color:#ffe8a1}

.share-btn{
  margin-top:40px;padding:12px 22px;border-radius:999px;
  background:linear-gradient(90deg,#ffd60a,#ffb703);
  color:#3a0a00;font-weight:600;
  cursor:pointer;position:relative;overflow:hidden;
  display:inline-flex;gap:8px;align-items:center;
}

.share-btn svg{width:16px;height:16px}

.share-btn::before{
  content:"";position:absolute;top:0;left:-100%;
  width:100%;height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,0.8),transparent);
  transition:.5s;
}
.share-btn:hover::before{left:100%}

.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,0.6);transform:scale(0);animation:rippleEffect .6s linear}
@keyframes rippleEffect{to{transform:scale(4);opacity:0}}

canvas{position:fixed;top:0;left:0;z-index:-1}

/* language toggle */
.toggle{
  position:fixed;top:20px;left:20px;
  padding:6px 12px;border-radius:20px;
  background:#ffd60a;color:#000;cursor:pointer;
  font-size:0.8rem;
}

</style>
</head>
<body>

<div class="bg"></div>
<div class="lamp"></div>
<div class="drum"></div>
<div class="cursor-glow" id="glow"></div>
<div class="toggle" onclick="toggleLang()">සිංහල / EN</div>

<canvas id="canvas"></canvas>

<div class="container">
  <h1 id="title">සුභ අලුත් අවුරුද්දක් වේවා ✨</h1>
  <p id="text">ඔබට සතුට, සම්පන්නත්වය හා නව ආරම්භයන් පිරුණු වසරක් වේවා 🌞</p>

  <div class="share-btn" onclick="handleShare(event)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="18" cy="5" r="3"></circle>
      <circle cx="6" cy="12" r="3"></circle>
      <circle cx="18" cy="19" r="3"></circle>
    </svg>
    <span>Share the joy</span>
  </div>
</div>

<script>

mousemove=e=>{glow.style.left=e.clientX+'px';glow.style.top=e.clientY+'px'}

let sinhala=true;
function toggleLang(){
  sinhala=!sinhala;
  if(sinhala){
    title.innerText="අවුරුදු 2026 ✨";
    text.innerText="ඔබට සතුට, සම්පන්නත්වය හා නව ආරම්භයන් පිරුණු වසරක් වේවා 🌞";
  }else{
    title.innerText="Happy New Year ✨";
    text.innerText="Wishing you joy, prosperity & new beginnings 🌞";
  }
}

function handleShare(e){createRipple(e);share();burst(e.clientX,e.clientY)}

function createRipple(e){
  const b=e.currentTarget;
  const c=document.createElement("span");
  const d=Math.max(b.clientWidth,b.clientHeight);
  const r=d/2;
  c.style.width=c.style.height=d+'px';
  c.style.left=e.clientX-b.getBoundingClientRect().left-r+'px';
  c.style.top=e.clientY-b.getBoundingClientRect().top-r+'px';
  c.classList.add('ripple');
  b.appendChild(c);
}

function share(){
  const url=location.href;
  if(navigator.share){navigator.share({title:'Aurudu Wishes ✨',url}).catch(()=>fallback(url))}
  else fallback(url);
}

function fallback(url){window.open(`https://wa.me/?text=${encodeURIComponent("🌞 සුබ අලුත් අවුරුද්දක් වේවා ✨\n"+url)}`,'_blank')}

// firecracker particles
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
resize();onresize=resize;

let particles=[];
function explode(x,y){
  for(let i=0;i<40;i++){
    particles.push({x,y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:100});
  }
}

function animate(){
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.fillRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.life--;
    ctx.fillStyle=`hsl(${Math.random()*60+20},100%,60%)`;
    ctx.fillRect(p.x,p.y,2,2);
  });
  particles=particles.filter(p=>p.life>0);
  requestAnimationFrame(animate);
}
animate();

function burst(x,y){explode(x,y)}

// tests
console.assert(typeof toggleLang==='function','toggle missing');
console.assert(typeof burst==='function','burst missing');

</script>

</body>
</html>
