<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Year Experience ✨</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }

      body {
        min-height: 100vh;
        background: #000;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .bg {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at 30% 30%, #111, #000 60%);
        z-index: -2;
      }

      .bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background: url("https://grainy-gradients.vercel.app/noise.svg");
        opacity: 0.05;
      }

      .container {
        text-align: center;
        padding: 30px;
      }

      h1 {
        font-size: clamp(3rem, 7vw, 5rem);
        font-weight: 600;
        letter-spacing: -1px;
        opacity: 0;
        transform: translateY(20px);
        animation: fadeUp 1.5s ease forwards;
      }

      p {
        margin-top: 15px;
        font-size: clamp(1rem, 3vw, 1.2rem);
        opacity: 0;
        animation: fadeUp 1.5s ease forwards 0.5s;
      }

      button {
        margin-top: 30px;
        padding: 12px 24px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.05);
        color: #fff;
        backdrop-filter: blur(10px);
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: rgba(255, 255, 255, 0.15);
        transform: scale(1.05);
      }

      .share-fab {
        position: fixed;
        bottom: 20px;
        right: 20px;
        border-radius: 50%;
        width: 55px;
        height: 55px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        color: #000;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }

      @keyframes fadeUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      canvas {
        position: fixed;
        top: 0;
        left: 0;
        z-index: -1;
      }
    </style>
  </head>

  <body>
    <div class="bg"></div>

    <canvas id="canvas"></canvas>

    <div class="container">
      <h1 id="title">2026</h1>
      <p id="text">A new year. A new chapter.</p>
      <button onclick="reveal()">Enter</button>
    </div>

    <div class="share-fab" onclick="share()">↗</div>

    <script>
      function reveal() {
        document.getElementById("title").innerText = "Happy New Year ✨";
        document.getElementById("text").innerText = "Make it count.";
      }

      // ✅ FIXED SHARE FUNCTION (safe + fallback)
      function share() {
        const url = location.href;

        // Try native share safely
        if (navigator.share) {
          navigator
            .share({ title: "✨ New Year", url })
            .catch(() => fallbackShare(url));
        } else {
          fallbackShare(url);
        }
      }

      function fallbackShare(url) {
        try {
          // WhatsApp fallback (viral)
          window.open(
            `https://wa.me/?text=${encodeURIComponent("✨ Check this out 🎆\n" + url)}`,
            "_blank",
          );
        } catch (e) {
          // Final fallback: manual copy
          try {
            if (navigator.clipboard && window.isSecureContext) {
              navigator.clipboard.writeText(url);
              alert("Link copied! 🎉");
            } else {
              const input = document.createElement("input");
              input.value = url;
              document.body.appendChild(input);
              input.select();
              document.execCommand("copy");
              input.remove();
              alert("Link copied! 🎉");
            }
          } catch {
            alert("Copy this link manually:\n" + url);
          }
        }
      }

      /* smooth particles */
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      function resize() {
        canvas.width = innerWidth;
        canvas.height = innerHeight;
      }
      resize();
      window.addEventListener("resize", resize);

      let dots = [];
      for (let i = 0; i < 120; i++) {
        dots.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.5,
          vy: (Math.random() - 0.5) * 0.5,
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        dots.forEach((d) => {
          d.x += d.vx;
          d.y += d.vy;

          if (d.x < 0 || d.x > canvas.width) d.vx *= -1;
          if (d.y < 0 || d.y > canvas.height) d.vy *= -1;

          ctx.fillStyle = "rgba(255,255,255,0.3)";
          ctx.fillRect(d.x, d.y, 1.5, 1.5);
        });

        requestAnimationFrame(animate);
      }

      animate();

      /* TESTS */
      console.assert(typeof reveal === "function", "Reveal missing");
      console.assert(typeof share === "function", "Share missing");
      console.assert(typeof fallbackShare === "function", "Fallback missing");
    </script>
  </body>
</html>
